[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "batteryscope-studio"
version = "0.1.0"
description = "Local-first battery and USB power diagnostic foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "pyarrow>=19,<25",
  "duckdb>=1.2,<2",
  "structlog>=25,<27",
  "PySide6>=6.8,<7",
  "pyserial>=3.5,<4",
  "pyusb>=1.3,<2",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
hid = ["hidapi>=0.14,<1"]
ble = ["bleak>=0.22,<2"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "hypothesis>=6.120,<7"]

[project.scripts]
batteryscope = "batteryscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/batteryscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
