[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "batteryscope-studio"
version = "0.1.0"
description = "Local-first battery and USB power diagnostic foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "pyarrow>=19,<25",
  "duckdb>=1.2,<2",
  "structlog>=25,<27",
  "PySide6>=6.8,<7",
  "pyserial>=3.5,<4",
  "jsonschema>=4.23,<5",
  "tzdata>=2025.3; sys_platform == 'win32'",
]

[project.optional-dependencies]
device = ["pyusb>=1.3,<2", "hidapi>=0.14,<1", "bleak>=0.22,<2"]

[dependency-groups]
device-extra = ["pyusb>=1.3,<2", "hidapi>=0.14,<1", "bleak>=0.22,<2"]
dev = ["pytest>=8.3,<10", "pytest-qt>=4.4,<5", "hypothesis>=6.120,<7", "ruff>=0.9,<1", "mypy>=1.14,<2"]
docs = []

[project.scripts]
batteryscope = "batteryscope.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/batteryscope"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
